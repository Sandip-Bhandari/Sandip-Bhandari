<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact | Sandip Bhandari</title>
<style>
  :root{--red:#E62429;--blue:#1F4FD8;--bg:#0D1117;--card:#11161f;--text:#C9D1D9;--muted:#8B949E}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,Arial,sans-serif}
  body{position:relative;overflow-x:hidden;display:flex;align-items:center;justify-content:center;padding:32px 16px}
  .bg{position:fixed;inset:0;z-index:0;background:
      radial-gradient(600px 400px at 0% 0%,rgba(230,36,41,.30),transparent 70%),
      radial-gradient(700px 450px at 100% 100%,rgba(31,79,216,.35),transparent 70%),
      linear-gradient(135deg,#05070d,#0d1117 50%,#0a0f24);
      animation:pulse 6s ease-in-out infinite alternate}
  @keyframes pulse{from{filter:brightness(.85)}to{filter:brightness(1.15)}}
  svg.web{position:fixed;z-index:0;width:min(60vw,560px);height:auto;opacity:.5;pointer-events:none}
  svg.tl{top:0;left:0}
  svg.br{bottom:0;right:0;transform:rotate(180deg)}
  .dot{position:fixed;z-index:0;border-radius:50%;pointer-events:none;animation:tw 4s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.1;transform:translateY(0)}50%{opacity:.9;transform:translateY(-16px)}}
  .wrap{position:relative;z-index:1;width:100%;max-width:640px}
  .thread{position:absolute;right:48px;top:-32px;width:1px;background:#C9D1D9aa;height:60px;animation:drop 4s ease-in-out infinite;transform-origin:top;z-index:2}
  .thread::after{content:"🕷️";position:absolute;left:-10px;bottom:-22px;font-size:20px}
  @keyframes drop{0%,100%{height:40px}50%{height:90px}}
  .card{background:rgba(17,22,31,.88);border:1px solid #232b3a;border-top:3px solid var(--red);border-radius:14px;padding:32px 28px;box-shadow:0 0 40px rgba(230,36,41,.15),0 0 60px rgba(31,79,216,.12);backdrop-filter:blur(6px)}
  h1{margin:0 0 4px;font-family:Impact,'Arial Black',sans-serif;font-weight:400;letter-spacing:4px;font-size:32px;color:#fff;text-shadow:0 0 14px rgba(230,36,41,.6)}
  .sub{margin:0 0 24px;color:var(--muted);font-size:14px;letter-spacing:1px}
  label{display:block;margin:16px 0 6px;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--red);font-weight:600}
  input,textarea{width:100%;background:#0a0e14;color:#fff;border:1px solid #2a3344;border-radius:8px;padding:12px 14px;font:inherit;outline:none;transition:.2s}
  input:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(31,79,216,.3)}
  textarea{min-height:140px;resize:vertical}
  button{margin-top:22px;width:100%;padding:14px;border:0;border-radius:8px;font:inherit;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:#fff;cursor:pointer;background:linear-gradient(90deg,var(--red),var(--blue));transition:.2s}
  button:hover{filter:brightness(1.15);transform:translateY(-1px)}
  .alt{margin-top:18px;text-align:center;font-size:13px;color:var(--muted)}
  .alt a{color:#6ea0ff;text-decoration:none}
  .ok{display:none;margin-bottom:18px;padding:12px 14px;border-radius:8px;background:rgba(46,160,67,.15);border:1px solid #2ea043;color:#7ee787;font-size:14px}
  .hp{position:absolute;left:-9999px}
</style>
</head>
<body>
<div class="bg"></div>

<svg class="web tl" viewBox="0 0 400 400" fill="none" stroke="#C9D1D9" stroke-opacity=".6" stroke-width="1">
  <g id="w">
    <line x1="0" y1="0" x2="400" y2="0"/><line x1="0" y1="0" x2="390" y2="100"/><line x1="0" y1="0" x2="350" y2="200"/>
    <line x1="0" y1="0" x2="280" y2="290"/><line x1="0" y1="0" x2="200" y2="350"/><line x1="0" y1="0" x2="100" y2="390"/><line x1="0" y1="0" x2="0" y2="400"/>
    <path d="M57,0 Q55,45 56,14 M57,0 Q60,12 56,14"/>
    <path d="M100,0 Q95,35 96,26 Q70,60 26,96 Q22,98 0,100"/>
    <path d="M200,0 Q190,50 193,50 Q160,120 98,172 Q60,190 0,200"/>
    <path d="M300,0 Q290,75 292,75 Q240,170 150,260 Q100,285 0,300"/>
    <path d="M400,0 Q385,100 388,100 Q330,240 200,350 Q100,390 0,400"/>
  </g>
</svg>
<svg class="web br" viewBox="0 0 400 400" fill="none" stroke="#C9D1D9" stroke-opacity=".6" stroke-width="1">
  <use href="#w"/>
</svg>

<div class="dot" style="left:12%;top:25%;width:3px;height:3px;background:#E62429"></div>
<div class="dot" style="left:82%;top:18%;width:4px;height:4px;background:#1F4FD8;animation-delay:1s"></div>
<div class="dot" style="left:70%;top:75%;width:3px;height:3px;background:#fff;animation-delay:2s"></div>
<div class="dot" style="left:25%;top:80%;width:4px;height:4px;background:#E62429;animation-delay:.5s"></div>
<div class="dot" style="left:50%;top:10%;width:2px;height:2px;background:#fff;animation-delay:3s"></div>

<div class="wrap">
  <div class="thread"></div>
  <div class="card">
    <h1>GET IN TOUCH</h1>
    <p class="sub">Sandip Bhandari · Full-Stack &amp; Android Developer</p>

    <div class="ok" id="ok">✅ Message sent! I'll get back to you soon.</div>

    <form action="https://formsubmit.co/sandipbhandari805@gmail.com" method="POST">
      <input type="hidden" name="_subject" value="New message from your GitHub portfolio">
      <input type="hidden" name="_template" value="table">
      <input type="hidden" name="_next" id="next" value="">
      <input type="text" name="_honey" class="hp" tabindex="-1" autocomplete="off">

      <label for="name">Your Name</label>
      <input id="name" name="name" type="text" required placeholder="Peter Parker">

      <label for="email">Your Email</label>
      <input id="email" name="email" type="email" required placeholder="you@example.com">

      <label for="subject">Subject</label>
      <input id="subject" name="subject" type="text" placeholder="Job opportunity / Project / Hello">

      <label for="message">Message</label>
      <textarea id="message" name="message" required placeholder="Tell me what you have in mind..."></textarea>

      <button type="submit">Send Message</button>
    </form>

    <p class="alt">Or email directly: <a href="mailto:sandipbhandari805@gmail.com">sandipbhandari805@gmail.com</a></p>
  </div>
</div>

<script>
  var base = location.href.split('?')[0].split('#')[0];
  document.getElementById('next').value = base + '?sent=1';
  if (location.search.indexOf('sent=1') !== -1) {
    document.getElementById('ok').style.display = 'block';
  }
</script>
</body>
</html>
